<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Códigos QR · Lisbon City Villa</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="conteudo.js"></script>
  <style>
    body { margin: 0; background: #eee; font-family: Inter, system-ui, sans-serif; color: #1b2233; }
    .bar { padding: 16px; text-align: center; }
    .bar button { font: 600 15px Inter, sans-serif; padding: 10px 20px; border-radius: 10px; border: 0; background: #1d3a6b; color: #fff; cursor: pointer; }
    .bar p { color: #5d6475; font-size: 14px; }
    .sheet { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; padding: 0 16px 32px; }
    .card {
      width: 90mm; background: #fff; border-radius: 6mm; overflow: hidden; text-align: center;
      border: 1px solid #ddd; break-inside: avoid;
    }
    .top { background: #1d3a6b; color: #fff; padding: 6mm 5mm 5mm; }
    .top b { font: 600 20px Fraunces, Georgia, serif; display: block; }
    .top span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
    .qr { padding: 6mm; display: flex; justify-content: center; }
    .qr img, .qr canvas { width: 50mm !important; height: 50mm !important; }
    .cta { padding: 0 5mm 6mm; font-size: 13px; line-height: 1.5; }
    .cta strong { display: block; font-size: 15px; }
    @media print {
      body { background: #fff; } .bar { display: none; }
      .sheet { padding: 0; gap: 8mm; }
      .card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <button onclick="print()">Imprimir</button>
    <p>Um cartão por quarto. Os códigos apontam para: <code id="base"></code></p>
  </div>
  <div class="sheet" id="sheet"></div>
  <script>
    const base = SITE.url.endsWith("/") ? SITE.url : SITE.url + "/";
    document.getElementById("base").textContent = base;
    for (const q of SITE.quartos) {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `
        <div class="top"><b>${SITE.nome}</b><span>${q.nome.pt} · ${q.nome.en}</span></div>
        <div class="qr"></div>
        <div class="cta"><strong>Wi‑Fi · Check-out · Dicas</strong>Aponte a câmara · Scan with your camera</div>`;
      document.getElementById("sheet").appendChild(el);
      new QRCode(el.querySelector(".qr"), { text: base + "?quarto=" + encodeURIComponent(q.id), width: 400, height: 400, colorDark: "#1d3a6b", correctLevel: QRCode.CorrectLevel.M });
    }
  </script>
</body>
</html>
